
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Skate Johnny</title>

<style>
body {
  margin:0;
  background: linear-gradient(#5dade2,#ecf0f1);
  overflow:hidden;
  font-family: Arial, sans-serif;
}
canvas { display:block; }

#hud {
  position:fixed;
  top:10px;
  left:10px;
  background:rgba(0,0,0,.5);
  color:#fff;
  padding:10px;
  border-radius:12px;
}

#menu {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
}

button {
  padding:15px 30px;
  margin-top:15px;
  font-size:20px;
  border:none;
  border-radius:10px;
  background:#ff4757;
  color:white;
}
</style>
</head>

<body>

<div id="menu">
  <h1>🛹 SKATE JOHNNY</h1>
  <p>Tony Hawk style</p>
  <button onclick="start()">START</button>
</div>

<div id="hud">
Punkty: <span id="score">0</span><br>
Combo: <span id="combo">x1</span>
</div>

<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");

function resize(){
  c.width = innerWidth;
  c.height = innerHeight;
}
resize(); onresize = resize;

let game=false;
let score=0, combo=1;

let skater = {
  x:0, y:0, z:0,
  vx:0, vz:0,
  angle:0,
  air:false,
  trick:""
};

let keys = {};
onkeydown = e => keys[e.code]=true;
onkeyup = e => keys[e.code]=false;

// TOUCH (iOS)
c.ontouchstart = e => {
  if(!skater.air){
    skater.vz=14;
    skater.air=true;
    trick("OLLIE",100);
  }
};

// TRICKI
function trick(name, pts){
  skater.trick=name;
  combo++;
  score+=pts*combo;
}

// START
function start(){
  document.getElementById("menu").style.display="none";
  game=true;
}

// UPDATE
function update(){
  if(!game) return;

  if(keys.ArrowUp) skater.vx+=0.1;
  if(keys.ArrowLeft) skater.angle-=0.05;
  if(keys.ArrowRight) skater.angle+=0.05;

  if(keys.Space && !skater.air){
    skater.vz=14;
    skater.air=true;
    trick("OLLIE",100);
  }

  if(keys.KeyK && skater.air) trick("KICKFLIP",300);
  if(keys.KeyS && skater.air) trick("SHOVE-IT",250);

  skater.z += skater.vz;
  skater.vz -= 0.8;

  if(skater.z<=0){
    skater.z=0;
    skater.vz=0;
    skater.air=false;
    skater.trick="";
    combo=1;
  }

  skater.x += skater.vx;
  skater.vx*=0.98;

  scoreEl.textContent = Math.floor(score);
  comboEl.textContent = "x"+combo;
}

// DRAW
function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  // ground
  ctx.fillStyle="#7bed9f";
  ctx.fillRect(0,c.height*0.65,c.width,c.height);

  // ramp
  ctx.fillStyle="#95a5a6";
  ctx.fillRect(c.width/2+200,c.height*0.65-150,200,150);

  // rail (grind)
  ctx.fillStyle="#2f3542";
  ctx.fillRect(c.width/2-200,c.height*0.65-80,300,10);

  // skater
  ctx.save();
  ctx.translate(c.width/2, c.height*0.65 - skater.z);
  ctx.rotate(skater.angle);
  ctx.fillStyle="#e74c3c";
  ctx.fillRect(-12,-35,24,35);
  ctx.fillStyle="#2c2c2c";
  ctx.fillRect(-40,0,80,10);
  ctx.restore();

  // trick text
  if(skater.trick){
    ctx.fillStyle="white";
    ctx.font="30px Arial";
    ctx.fillText(skater.trick, c.width/2-70,100);
  }
}
